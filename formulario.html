<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario</title>
    </head>
    <body>
    <!-- HEADER -->
    <header class="Tit">
        <h1>Mi Instituto</h1>
        <nav>
            <a class="Url" href="Horario.html">Horario</a>
        </nav>
        <nav>
            <a class="HUrl" href="Horario2.html">Horario2</a>
        </nav>
        <nav>
            <a class="Hurl" href="ejemplo 1.html">Ejemplo 1</a>
        </nav>
    </header>
    <main>
        <h2>Formulario de contacto</h2>
        <!--form y fieldset son para establecer el formulario y el recuadro-->
        <form>
            <fieldset>
                <!--legend es para poner un título o nombre al formulario-->
                <legend>
                    Preguntas de formulario.
                </legend>
                <!--la p es para separar las preguntas, label para establecer el id y el texto de la pregunta-->
                <!--input es para establecer el tipo de respuesta (text = texto)-->
                <p>
                    <label for="nombre">*Nombre:</label>
                    <input type="text" id="nombre" name="Nombre" required />
                </p>
                <p>
                    <label for="apellidos">*Apellidos:</label>
                    <input type="text" id="apellidos" name="Apellidos" required />
                </p>
                <p>
                    <label for="password">*Contraseña:</label>
                    <input type="password" id="password" name="Contraseña" required />
                </p>
                <p>
                    <label for="e-mail">*Correo electrónico:</label>
                    <input type="text" id="e-mail" name="Correo electrónico" required />
                </p>
                <p>
                    <label for="number">*Número de contacto:</label>
                    <input type="number" id="number" name="Número de contacto:" required />
                </p>
                <p>
                    <label for="fecha">*Fecha de tutoría</label>
                    <input type="date" id="fecha" name="Fecha" required />
                </p>
                <p>
                    <label for="hora">*Hora de tutoría</label>
                    <!--step="60" sirve para establecer el tiempo en minutos en caso de que venga con segundos-->
                    <input step="60" type="time" id="hora" name="Hora de tutoría" required />
                </p>
                <button type="submit">Enviar</button>
                <button type="reset">Limpiar</button>
            </fieldset>
            <fieldset>
                <legend>Valores numéricos</legend>

                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad"><br><br>

                    <label for="nivel">Nivel:</label>
                    <input type="range" id="nivel" name="nivel"><br><br>

                    <label for="color">Color favorito:</label>
                    <input type="color" id="color" name="color">
            </fieldset>

                <!-- Opciones -->
            <fieldset>
                <legend>Opciones</legend>

                <p>Selecciona una opción:</p>
                    <input type="radio" id="opcion1" name="opcion" value="1">
                    <label for="opcion1">Opción 1</label><br>
                    <input type="radio" id="opcion2" name="opcion" value="2">
                    <label for="opcion2">Opción 2</label><br>
                    <input type="radio" id="opcion3" name="opcion" value="3">
                    <label for="opcion3">Opción 3</label><br><br>

                <p>Selecciona tus aficiones:</p>
                    <input type="checkbox" id="deporte" name="aficiones" value="deporte">
                    <label for="deporte">Deporte</label><br>
                    <input type="checkbox" id="musica" name="aficiones" value="musica">
                    <label for="musica">Música</label><br>
                    <input type="checkbox" id="informatica" name="aficiones" value="informatica">
                    <label for="informatica">Informática</label>
            </fieldset>

                <!-- Listas -->
            <fieldset>
                <legend>Listas</legend>

                    <label for="provincia">Provincia:</label>
                    <select id="provincia" name="provincia">
                    <option value="">Selecciona una provincia</option>
                </select><br><br>

                    <label for="estudios">Estudios:</label>
                    <select id="estudios" name="estudios">
                    <option value="dam">DAM</option>
                </select><br><br>

                    <label for="lenguajes">Lenguajes favoritos:</label>
                    <select id="lenguajes" name="lenguajes" multiple size="4">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                </select>
            </fieldset>

                <!-- Texto -->
            <fieldset>
                <legend>Texto</legend>

                <label for="comentarios">Comentarios:</label><br>
                <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
            </fieldset>

                <!-- Otros elementos -->
            <fieldset>
                <legend>Otros elementos</legend>

                <label for="archivo">Selecciona un archivo:</label>
                <input type="file" id="archivo" name="archivo"><br><br>

                <label for="navegador">Navegador favorito:</label>
                <input type="text" id="navegador" name="navegador">
            </fieldset>
        </form>
    </main>
    <footer class="footer">
        <p>Formulario DAW-1 CIFP Virgen De Gracia</p>
    </footer>
</html>
